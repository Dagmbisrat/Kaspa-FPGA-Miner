name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Each job restores the Verilator cache independently rather than waiting
  # on a shared setup job — on a cache hit (the common case) that avoids a
  # serial wait; on a miss (pinned version bump) a few jobs rebuild it
  # concurrently instead of one job blocking everyone. actions/cache silently
  # drops duplicate saves to the same key, so concurrent misses don't fail.
  test-fixed-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sim-env

      - name: keccak
        run: make -C hw/core/crypto/keccak runtest

      - name: xoshiro256pp
        run: make -C hw/core/utils/xoshiro256pp runtest

      - name: matrix_generator
        run: make -C hw/core/matrix/matrix_generator runtest

      - name: Upload waveforms on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: waveforms-${{ github.job }}-${{ strategy.job-index }}
          path: hw/**/sim/*.vcd
          if-no-files-found: ignore

  # cshake256_pipelined_core: FOLDED/STAGES boundary configs. Full sweep of
  # all 16 combos is deliberately not run here — see docs/folding_parameters.md.
  test-cshake256:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            folded: 0
            stages: 24
          - name: folded-min
            folded: 1
            stages: 1
          - name: folded-mid
            folded: 1
            stages: 4
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sim-env

      - name: cshake256 (${{ matrix.name }})
        run: make -C hw/core/crypto/cshake256 runtest FOLDED=${{ matrix.folded }} STAGES=${{ matrix.stages }}

      - name: Upload waveforms on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: waveforms-${{ github.job }}-${{ strategy.job-index }}
          path: hw/**/sim/*.vcd
          if-no-files-found: ignore

  # matmul_pipelined_unit: min/default/max NUM_STAGES, both matrix targets.
  test-matmul:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        num_stages: [1, 8, 64]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sim-env

      - name: matmul_unit runtest (NUM_STAGES=${{ matrix.num_stages }})
        run: make -C hw/core/matrix/matmul_unit runtest NUM_STAGES=${{ matrix.num_stages }}

      - name: matmul_unit wiretest (NUM_STAGES=${{ matrix.num_stages }})
        run: make -C hw/core/matrix/matmul_unit wiretest NUM_STAGES=${{ matrix.num_stages }}

      - name: Upload waveforms on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: waveforms-${{ github.job }}-${{ strategy.job-index }}
          path: hw/**/sim/*.vcd
          if-no-files-found: ignore

  # core: CSHAKE_FOLDED/CSHAKE_STAGES boundary configs (forwarded straight to
  # cshake256; MATMUL_STAGES stays default since matmul has no fold param yet).
  test-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            cshake_folded: 0
            cshake_stages: 24
          - name: folded-min
            cshake_folded: 1
            cshake_stages: 1
          - name: folded-mid
            cshake_folded: 1
            cshake_stages: 4
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sim-env

      - name: core (${{ matrix.name }})
        run: make -C hw/core runtest CSHAKE_FOLDED=${{ matrix.cshake_folded }} CSHAKE_STAGES=${{ matrix.cshake_stages }}

      - name: Upload waveforms on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: waveforms-${{ github.job }}-${{ strategy.job-index }}
          path: hw/**/sim/*.vcd
          if-no-files-found: ignore
