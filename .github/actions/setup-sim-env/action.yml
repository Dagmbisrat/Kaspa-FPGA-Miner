name: Set up simulation environment
description: >
  Installs build dependencies and a pinned Verilator build (cached across
  runs/jobs). Assumes actions/checkout already ran in the calling job.

runs:
  using: composite
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y git make autoconf g++ flex bison libfl-dev help2man python3 python3-pip
        pip3 install pycryptodome

    - name: Cache Verilator
      id: cache-verilator
      uses: actions/cache@v4
      with:
        path: /opt/verilator
        key: verilator-v5.050-${{ runner.os }}

    # Surfaces hit/miss on every job's summary page so the real hit rate
    # across PRs can be measured (gh run list / gh api) instead of guessed.
    - name: Report Verilator cache status
      shell: bash
      run: |
        if [ "${{ steps.cache-verilator.outputs.cache-hit }}" = "true" ]; then
          echo "verilator cache (${{ github.job }}): HIT" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "verilator cache (${{ github.job }}): MISS" >> "$GITHUB_STEP_SUMMARY"
        fi

    # apt Verilator on ubuntu-latest is too old (5.020) and mis-compiles the
    # Keccak unpacked-array assignment; build a pinned recent release instead.
    - name: Build Verilator 5.050
      if: steps.cache-verilator.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git clone https://github.com/verilator/verilator
        cd verilator
        git checkout v5.050
        autoconf
        ./configure --prefix=/opt/verilator
        make -j"$(nproc)"
        sudo make install

    - name: Add Verilator to PATH
      shell: bash
      run: echo "/opt/verilator/bin" >> "$GITHUB_PATH"

    - name: Verilator version
      shell: bash
      run: verilator --version
